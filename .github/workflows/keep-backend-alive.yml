name: Keep Render backend alive

on:
  schedule:
    # Render 무료 플랜은 15분간 요청이 없으면 잠든다. 10분 간격으로 핑을 보내 여유를 둔다.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: curl -fsS --max-time 20 https://creatorflow-backend-iudj.onrender.com/
